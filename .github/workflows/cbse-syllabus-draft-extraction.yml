name: CBSE Syllabus Draft Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF extraction library
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Extract official PDF text into drafts
        run: python .github/scripts/extract_cbse_pdf_text.py

      - name: Upload review drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbse-syllabus-review-drafts
          path: draft-output/
          if-no-files-found: warn
          retention-days: 14
          
