name: Check Syllabus Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

jobs:
  check-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check registered official websites
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          config = Path("data/syllabus-sources.json")
          data = json.loads(config.read_text(encoding="utf-8"))
          boards = data.get("boards", [])

          if not boards:
              raise SystemExit("No boards configured.")

          failed = 0
          print("Study Tracker source check")
          print("==========================")

          for board in boards:
              name = board.get("name", board.get("id", "Unknown"))
              url = board.get("officialWebsite", "")

              if not url.startswith("https://"):
                  print(f"INVALID URL | {name} | {url}")
                  failed += 1
                  continue

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "StudyTracker/1.0"}
                  )
                  with urllib.request.urlopen(
                      request, timeout=20
                  ) as response:
                      status = response.status

                  print(f"REACHABLE | {name} | HTTP {status} | {url}")

              except Exception as error:
                  print(f"CHECK FAILED | {name} | {url} | {error}")
                  failed += 1

          print()
          print(f"Boards checked: {len(boards)}")
          print(f"Failed checks: {failed}")
          print(
              "Website reachability does not confirm "
              "that syllabus data is current."
          )
          PY
