name: Syllabus Review PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate syllabus draft
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          drafts = sorted(Path("data/drafts").glob("*.json"))

          if not drafts:
              raise SystemExit("No syllabus drafts found.")

          for path in drafts:
              data = json.loads(path.read_text(encoding="utf-8"))

              if data.get("status") != "pending_review":
                  raise SystemExit(f"Not pending review: {path}")

              if data.get("approved") is not False:
                  raise SystemExit(f"Draft must remain unapproved: {path}")

              print(f"Validated: {path}")

          print("Draft validation passed.")
          PY

      - name: Create syllabus review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          BRANCH="syllabus-review-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add data/drafts

          if git diff --cached --quiet; then
            echo "No draft changes to submit for review."
            exit 0
          fi

          git commit -m "Prepare syllabus draft for admin review"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Review CBSE Class 10 syllabus draft" \
            --body "Admin review required. Verify the official syllabus and chapter numbering before merging. This PR does not publish the draft automatically."
