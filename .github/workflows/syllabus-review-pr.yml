name: Syllabus Review PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check syllabus draft
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          drafts = sorted(Path("data/drafts").glob("*.json"))

          if not drafts:
              raise SystemExit("No syllabus drafts found.")

          for path in drafts:
              data = json.loads(path.read_text(encoding="utf-8"))

              if data.get("status") != "pending_review":
                  raise SystemExit(
                      f"{path} is not pending review."
                  )

              if data.get("approved") is not False:
                  raise SystemExit(
                      f"{path} must not be approved automatically."
                  )

              print(
                  f"Review required: {path} — "
                  f"{data.get('board')} Class {data.get('class')} "
                  f"{data.get('subject')}"
              )

          print("Draft checks passed. No syllabus was published.")
