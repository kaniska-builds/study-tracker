name: Syllabus Review PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-review-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare review copy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source_dir = Path("data/drafts")
          review_dir = Path("data/review-queue")
          review_dir.mkdir(parents=True, exist_ok=True)

          drafts = sorted(source_dir.glob("*.json"))

          if not drafts:
              raise SystemExit("No syllabus drafts found.")

          for source in drafts:
              data = json.loads(source.read_text(encoding="utf-8"))

              if data.get("status") != "pending_review":
                  raise SystemExit(f"Draft is not pending review: {source}")

              if data.get("approved") is not False:
                  raise SystemExit(f"Draft must remain unapproved: {source}")

              target = review_dir / source.name
              target.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8"
              )
              print(f"Prepared review copy: {target}")

          print("Review copies prepared. Nothing was published.")
          PY

      - name: Create or update review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          BRANCH="syllabus-review-queue"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH"
          git add data/review-queue/

          if git diff --cached --quiet; then
            echo "No new review-copy changes to commit."
          else
            git commit -m "Prepare syllabus drafts for admin review"
            git push --force origin "$BRANCH"
          fi

          if gh pr list \
            --repo "$REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq 'length' | grep -q '^0$'; then

            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Review CBSE Class 10 syllabus draft" \
              --body "Review copy of unapproved syllabus drafts. Verify all details against official sources. This PR does not publish or approve the syllabus."
          else
            echo "An open review PR already exists for this branch."
          fi
