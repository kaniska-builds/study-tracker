name: Syllabus Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check official syllabus pages
        shell: bash
        run: |
          failures=0

          check_url() {
            name="$1"
            url="$2"

            echo "Checking: $name"
            if curl --location --silent --show-error --fail \
              --connect-timeout 10 --max-time 60 \
              --retry 1 --retry-delay 2 \
              -A "Mozilla/5.0" "$url" -o /dev/null; then
              echo "PASS: $name"
            else
              code=$?
              echo "::warning title=$name unavailable::Could not verify this source (curl exit $code)"
              failures=$((failures + 1))
            fi
          }

          check_url "CBSE" \
            "https://cbseacademic.nic.in/curriculum_2027.html"

          check_url "CISCE" \
            "https://cisce.org/"

          check_url "CHSE Odisha" \
            "https://chseodisha.nic.in/syllabus/"

          echo "Official sources unavailable: $failures"

          if [ "$failures" -eq 0 ]; then
            echo "All official pages were fetched."
          else
            echo "Some sources could not be verified. See warnings above."
          fi
          
