name: Syllabus Checker

"on":
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check website file
        run: |
          echo "Syllabus Checker started."
          if [ -f index.html ]; then
            echo "SUCCESS: index.html exists."
          else
            echo "ERROR: index.html was not found."
            exit 1
          fi
          echo "Official syllabus comparison is not implemented yet."
