
name: Monitor CBSE Class 10 PDFs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check official PDF fingerprints
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request

          urls = {
              "Mathematics": "https://cbseacademic.nic.in/web_material/CurriculumMain27/SecPart1/Maths_SecP1X_2026-27.pdf",
              "Social Science": "https://cbseacademic.nic.in/web_material/CurriculumMain27/SecPart1/SocialScience_SecP1X_2026-27.pdf",
          }

          for subject, url in urls.items():
              print(f"\nChecking {subject}: {url}")
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "StudyTracker/1.0"}
              )
              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      data = response.read()

                  if not data.startswith(b"%PDF"):
                      print("WARNING: Response is not a PDF.")
                      continue

                  fingerprint = hashlib.sha256(data).hexdigest()
                  print(f"PDF reachable; bytes: {len(data)}")
                  print(f"SHA-256: {fingerprint}")

              except Exception as exc:
                  print(f"CHECK FAILED: {exc}")
                  raise SystemExit(1)

          print("\nMonitoring complete. No syllabus JSON was changed.")
          PY
          
