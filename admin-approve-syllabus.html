
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Tracker — Syllabus Approval</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#100e1c;color:#f7f5ff;font-family:system-ui,sans-serif}
main{max-width:760px;margin:16px auto;background:#191629;padding:18px;border:1px solid #7047ff;border-radius:16px}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:9px;font:inherit}
input{background:#090914;color:white;border:1px solid #49406a}
button{background:#a78bfa;color:#130c22;font-weight:700;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#302849;color:#f7f5ff;border:1px solid #62518b}
.card{border:1px solid #49406a;border-radius:12px;padding:14px;margin:14px 0;overflow-wrap:anywhere}
.muted{color:#c5bddf;line-height:1.6}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
.unit{padding:10px 0;border-bottom:1px solid #39304f}
.good{color:#86efac}
.bad{color:#fca5a5}
.review{display:flex;gap:10px;align-items:flex-start;line-height:1.5;margin:14px 0}
.review input{width:auto;margin:4px 0;flex-shrink:0}
a{color:#c4b5fd}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Study Tracker — Syllabus Approval</h1>
<p class="muted">Review every topic against the official CBSE syllabus before publication.</p>
<p><a href="https://cbseacademic.nic.in/web_material/CurriculumMain27/SecPart1/Maths_SecP1X_2026-27.pdf" target="_blank" rel="noopener">Open official CBSE Mathematics syllabus 2026–27</a></p>

<form id="loginForm">
<label for="email">Admin email</label>
<input id="email" type="email" required autocomplete="username">
<label for="password">Admin password</label>
<input id="password" type="password" required autocomplete="current-password">
<button id="loginButton">Sign in</button>
</form>

<section id="panel" hidden>
<p id="welcome" class="muted"></p>
<button id="loadButton">Load pending drafts</button>
<div id="drafts"></div>
<button id="logoutButton" class="secondary">Log out</button>
</section>
<p id="status" class="muted" role="status" aria-live="polite">Please sign in with the verified admin account.</p>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyD3Eakk0Q1qk8u2zUWJDkpUUUCgMBbJMWs",
 authDomain:"study-tracker-dacd7.firebaseapp.com",
 projectId:"study-tracker-dacd7",
 storageBucket:"study-tracker-dacd7.firebasestorage.app",
 messagingSenderId:"717578428619",
 appId:"1:717578428619:web:0202f68bc2c4279b6e7b4e"
};
const ADMIN="instagramid1994@gmail.com";
const COURSES={
 "cbse-class-10-mathematics-basic-241":{name:"Basic Mathematics",code:"241"},
 "cbse-class-10-mathematics-standard-041":{name:"Standard Mathematics",code:"041"}
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
let isAdmin=false,busy=false;

function setStatus(message,type=""){
 $("status").textContent=message;
 $("status").className="muted "+type;
}
function verifyAdmin(){
 const u=auth.currentUser;
 if(!isAdmin||!u||u.email!==ADMIN||!u.emailVerified)
  throw new Error("Verified admin login is required.");
}
function updateAuthUI(user){
 isAdmin=!!(user&&user.email===ADMIN&&user.emailVerified);
 $("loginForm").hidden=isAdmin;
 $("panel").hidden=!isAdmin;
 $("welcome").textContent=isAdmin?"Signed in as verified admin: "+ADMIN:"";
 if(!user)setStatus("Please sign in.");
 else if(!isAdmin)setStatus("Access denied. Use the verified admin account.","bad");
 else setStatus("Admin access confirmed. Load pending drafts.");
}
onAuthStateChanged(auth,updateAuthUI);

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 $("loginButton").disabled=true;
 setStatus("Signing in...");
 try{
  const email=$("email").value.trim().toLowerCase();
  if(email!==ADMIN)throw new Error("Use the configured admin email.");
  await signInWithEmailAndPassword(auth,email,$("password").value);
 }catch(e){setStatus("Sign-in failed: "+e.message,"bad");}
 finally{$("loginButton").disabled=false;}
});
$("logoutButton").addEventListener("click",async()=>{
 try{await signOut(auth);$("drafts").replaceChildren();setStatus("Logged out.");}
 catch(e){setStatus("Could not log out: "+e.message,"bad");}
});

function validateDraft(id,data,units){
 const errors=[],expected=COURSES[id];
 if(!expected)return ["Unknown course ID. Only configured Basic and Standard drafts can be approved."];
 if(data.status!=="pending_review")errors.push("Draft is not pending_review.");
 if(data.courseName!==expected.name)errors.push("Course name does not match.");
 if(String(data.subjectCode||"")!==expected.code)errors.push("Course code does not match "+expected.code+".");
 if(typeof data.title!=="string"||!data.title)errors.push("Course title is missing.");
 if(units.length!==7)errors.push("Expected 7 units; found "+units.length+".");
 const nums=new Set();
 let marks=0;
 for(const item of units){
  const u=item.data(),n=Number(u.unitNumber);
  if(!Number.isInteger(n)||n<1||n>7)errors.push("Invalid unit number in "+item.id+".");
  else if(nums.has(n))errors.push("Duplicate unit number "+n+".");
  nums.add(n);
  if(typeof u.title!=="string"||!u.title.trim())errors.push("Missing unit title in "+item.id+".");
  if(!Number.isFinite(Number(u.marks))||Number(u.marks)<=0)errors.push("Invalid marks in "+item.id+".");
  else marks+=Number(u.marks);
  if(!Array.isArray(u.topics)||!u.topics.length||u.topics.some(t=>typeof t!=="string"||!t.trim()))
   errors.push("Missing or invalid topics in "+item.id+".");
 }
 if(nums.size!==7)errors.push("Unit numbers must cover 1 through 7.");
 for(let n=1;n<=7;n++)if(!nums.has(n))errors.push("Missing unit number "+n+".");
 if(marks!==80)errors.push("Unit marks total "+marks+"; expected 80.");
 return errors;
}

async function loadDrafts(){
 verifyAdmin();
 $("loadButton").disabled=true;
 $("drafts").replaceChildren();
 setStatus("Loading pending drafts...");
 try{
  const snap=await getDocs(collection(db,"syllabusDrafts"));
  let count=0;
  for(const parent of snap.docs){
   const data=parent.data();
   if(data.status!=="pending_review")continue;
   count++;
   const us=await getDocs(collection(db,"syllabusDrafts",parent.id,"units"));
   const units=[...us.docs].sort((a,b)=>(Number(a.data().unitNumber)||0)-(Number(b.data().unitNumber)||0));
   const errors=validateDraft(parent.id,data,units);
   const card=document.createElement("article");card.className="card";
   const h=document.createElement("h2");h.textContent=data.title||parent.id;card.append(h);
   const info=document.createElement("p");info.className="muted";
   info.textContent="Course: "+(data.courseName||"Not specified")+" | Code: "+(data.subjectCode||"—")+" | Status: "+data.status;
   card.append(info);
   const summary=document.createElement("p");
   summary.className=errors.length?"bad":"good";
   summary.textContent=errors.length?"Publication blocked:\n• "+errors.join("\n• "):
    "Structure checks passed: 7 units and 80 marks. Topic accuracy requires your review.";
   card.append(summary);
   for(const ud of units){
    const u=ud.data(),section=document.createElement("div");section.className="unit";
    const uh=document.createElement("strong");uh.textContent=(u.title||ud.id)+" — "+(u.marks??"?")+" marks";
    const topics=document.createElement("p");topics.className="muted";
    topics.textContent=Array.isArray(u.topics)?u.topics.join("; "):"No topics recorded.";
    section.append(uh,topics);card.append(section);
   }
   if(!errors.length){
    const label=document.createElement("label");label.className="review";
    const check=document.createElement("input");check.type="checkbox";
    const text=document.createElement("span");
    text.textContent="I reviewed every topic and restriction against the official CBSE PDF, confirmed the course code and marks, and checked that the Firestore rules are configured.";
    label.append(check,text);card.append(label);
    const button=document.createElement("button");
    button.textContent="Approve and publish "+COURSES[parent.id].name;
    button.disabled=true;
    check.addEventListener("change",()=>button.disabled=!check.checked);
    button.addEventListener("click",()=>publishCourse(parent.id,button,check));
    card.append(button);
   }else{
    const blocked=document.createElement("button");
    blocked.disabled=true;blocked.textContent="Publication blocked — fix draft first";card.append(blocked);
   }
   $("drafts").append(card);
  }
  setStatus(count?"Found "+count+" pending course(s).":"No pending drafts found.");
 }catch(e){setStatus("Could not load drafts: "+e.message+"\nCheck Firestore rules and admin access.","bad");}
 finally{$("loadButton").disabled=false;}
}
$("loadButton").addEventListener("click",loadDrafts);

async function publishCourse(id,button,check){
 verifyAdmin();
 if(busy)return;
 if(!check.checked){setStatus("Confirm your review first.","bad");return;}
 const expected=COURSES[id];
 if(!expected){setStatus("Unknown course ID; publication blocked.","bad");return;}
 if(!confirm("Publish "+expected.name+" ("+expected.code+")? This records your review confirmation. Continue only if you checked the official PDF."))return;
 busy=true;button.disabled=true;
 try{
  verifyAdmin();
  const draftRef=doc(db,"syllabusDrafts",id);
  const latest=await getDoc(draftRef);
  if(!latest.exists())throw new Error("Draft no longer exists.");
  const data=latest.data();
  const us=await getDocs(collection(db,"syllabusDrafts",id,"units"));
  const units=us.docs;
  const errors=validateDraft(id,data,units);
  if(errors.length)throw new Error("Draft failed checks:\n• "+errors.join("\n• "));
  if(data.status!=="pending_review")throw new Error("Draft is no longer pending.");
  const parentRef=doc(db,"publishedSyllabi",id);
  const existing=await getDoc(parentRef);
  if(existing.exists()&&existing.data().status==="published")
   throw new Error("This course is already published; no changes made.");
  const batch=writeBatch(db),stamp=serverTimestamp();
  batch.set(parentRef,{...data,status:"published",verified:true,approvedBy:ADMIN,approvedAt:stamp,sourceDraftId:id,reviewConfirmed:true});
  for(const u of units){
   batch.set(doc(db,"publishedSyllabi",id,"units",u.id),{...u.data(),status:"published",verified:true,approvedBy:ADMIN,approvedAt:stamp});
   batch.update(doc(db,"syllabusDrafts",id,"units",u.id),{status:"published",verified:true,approvedBy:ADMIN,approvedAt:stamp});
  }
  batch.update(draftRef,{status:"published",verified:true,approvedBy:ADMIN,approvedAt:stamp,reviewConfirmed:true});
  await batch.commit();
  setStatus("Published successfully: "+expected.name+" ("+expected.code+").\nThis does not automatically connect the student website to Firestore.");
  await loadDrafts();
 }catch(e){setStatus("Approval failed: "+e.message+"\nNo successful publication is confirmed. Do not change rules again until we inspect the exact error.","bad");button.disabled=false;}
 finally{busy=false;}
}
</script>
</body>
</html>
